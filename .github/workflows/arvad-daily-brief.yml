name: ARVAD Weekly Market Brief

on:
  workflow_dispatch:

jobs:
  build-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Yekaterinburg
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly brief locally in GitHub runner
        run: python scripts/build_arvad_market_brief.py --lookback-hours 168

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arvad-weekly-brief
          path: |
            output/html/*.html
            output/json/*.json
            output/markdown/*.md
          if-no-files-found: error

      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update ARVAD weekly brief"
          git push origin HEAD:${{ github.ref_name }}
